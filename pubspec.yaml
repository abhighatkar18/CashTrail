name: cashtrail
description: A personal expense tracker built using Flutter.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.3
  fl_chart: ^1.1.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true